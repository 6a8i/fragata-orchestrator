name: Bug Report
description: Create a report to help us improve
labels: ['type: bug :bug:', 'status: triaging :triangular_flag_on_post:']
body:
  - type: markdown
    attributes:
      value: |
        1. ⚠️ **If you don't follow this template, the issue will be closed**.
        2. ⚠️ **If your issue can't be easily reproduced, please start a [discussion](https://github.com/6a8i/fragata-orchestrator/discussions) first**.
  - type: markdown
    attributes:
      value: '## Your Fragata build'
  - type: input
    id: fragata-commit
    attributes:
      label: Provide your commit number
      description: Shown on the About page. If it's older than a week, please update before reporting.
      placeholder: e.g. 579f0
    validations:
      required: true
  - type: markdown
    attributes:
      value: '## Bug description:'
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is
    validations:
      required: true
  - type: textarea
    id: error-message
    attributes:
      label: Error message
      render: Text
    validations:
      required: false
  - type: textarea
    id: steps
    attributes:
      label: To reproduce
      description: 'Steps to reproduce the behavior:'
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: false
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem
    validations:
      required: false
  - type: markdown
    attributes:
      value: '## Environment (please provide the following information):'
  - type: input
    id: node-version
    attributes:
      label: Node
      placeholder: e.g. 24.11.0
    validations:
      required: true
  - type: input
    id: hypervisor-version
    attributes:
      label: Hypervisor
      placeholder: e.g. Fragata Host 8.3 / XCP-ng 8.3
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here
    validations:
      required: false
